on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: 25
        cache: 'sbt'

    - run: ./sbta "Test / compile; testFull; stage"
